<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:title" content="Dryland Pro - Free Swim Workout Generator">
    <meta property="og:description"

    <meta property="og:image" content="">

    <title>Dryland Pro - Swimmer's Generator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --input-bg: #0f172a;
            --accent: #38bdf8;
            --success: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 680px;
            flex: 1;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            display: block;
            /* Changed from flex to block for centering */
        }

        .header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        h1 {
            font-weight: 900;
            letter-spacing: -1.5px;
            margin: 0;
            font-size: 2.8rem;
            line-height: 1;
        }

        h1 span {
            color: var(--accent);
        }

        .subtitle {
            color: var(--text-muted);
            margin-top: 12px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 700;
            opacity: 0.8;
        }

        .db-count {
            font-size: 0.7rem;
            color: #475569;
            margin-top: 8px;
            font-family: monospace;
        }

        .controls {
            background: var(--card-bg);
            padding: 35px;
            border-radius: var(--radius);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* --- SEARCH SECTION --- */
        .search-section {
            display: grid;
            grid-template-columns: 1.2fr 1.2fr 1fr;
            gap: 20px;
            align-items: end;
        }

        label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 8px;
            display: block;
        }

        select {
            width: 100%;
            padding: 0 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: var(--input-bg);
            color: white;
            font-size: 0.9rem;
            outline: none;
            height: 50px;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2338bdf8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 15px top 50%;
            background-size: 10px auto;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease;
        }

        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
        }

        button {
            border: none;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.5px;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: var(--accent);
            color: #0f172a;
        }

        /* --- SHARE BUTTON STYLE (Under Results) --- */
        .btn-share {
            background: transparent;
            border: 1px dashed var(--text-muted);
            color: var(--text-muted);
            margin-top: 25px;
            /* Space above button */
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
        }

        .btn-share:hover {
            border-color: var(--accent);
            color: var(--accent);
            opacity: 1;
            transform: translateY(-1px);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #475569;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 2px;
            opacity: 0.6;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #334155;
        }

        .divider span {
            padding: 0 15px;
        }

        .btn-random {
            background: linear-gradient(135deg, var(--accent), var(--success));
            color: #0f172a;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.2);
        }

        /* --- RESULTS GRID --- */
        .results-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            width: 100%;
            /* Removed padding-bottom since share button is now there */
        }

        .section-title {
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
            text-align: center;
            font-weight: 700;
        }

        /* --- CARD DESIGN V11 --- */
        .exercise-card {
            background: var(--card-bg);
            padding: 22px;
            border-radius: var(--radius);
            border-left: 5px solid var(--accent);
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            /* For the glow effect */
        }

        /* Flashlight Effect - Desktop Only */
        @media (hover: hover) {
            .exercise-card::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: radial-gradient(1200px circle at var(--x) var(--y), rgba(255, 255, 255, 0.04), transparent 60%);
                z-index: 1;
                pointer-events: none;
                opacity: 0;
                transition: opacity 0.5s;
            }

            .exercise-card::after {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: radial-gradient(600px circle at var(--x) var(--y), rgba(56, 189, 248, 0.2), transparent 40%);
                z-index: 0;
                pointer-events: none;
                opacity: 0;
                transition: opacity 0.5s;
                border-radius: var(--radius);
                /* Ensure it follows border radius */
            }

            .exercise-card:hover::before,
            .exercise-card:hover::after {
                opacity: 1;
            }

            .exercise-card:hover {
                box-shadow: 0 10px 40px -10px rgba(56, 189, 248, 0.15);
            }

            /* Ensure content stays above the glow */
            .exercise-card>* {
                position: relative;
                z-index: 2;
            }
        }

        .random-card {
            border-left: 5px solid var(--success);
        }

        .exercise-card h3 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 800;
            line-height: 1.3;
            color: var(--text-main);
        }

        .exercise-desc {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #cbd5e1;
            background: rgba(15, 23, 42, 0.5);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .meta-container {
            display: flex;
            gap: 25px;
            margin-top: 5px;
        }

        .meta-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .meta-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .tag {
            font-size: 0.75rem;
            padding: 6px 12px;
            border-radius: 8px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 0.3px;
            width: fit-content;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 50px;
            font-style: italic;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius);
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }

        footer {
            text-align: center;
            margin-top: 60px;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
        }

        footer p {
            margin: 5px 0;
        }

        .footer-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
            border-bottom: 1px dashed var(--accent);
            transition: all 0.2s;
        }

        .footer-link:hover {
            opacity: 0.8;
            border-bottom-style: solid;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .search-section {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .exercise-card {
                padding: 18px;
            }

            .header-content h1 {
                margin-top: 10px;
                /* Prevent overlap with badge if needed */
            }

            .streak-counter {
                font-size: 0.9rem;
                padding: 6px 12px;
                flex: 1 !important;
                /* 25% on mobile */
            }

            .btn-random {
                flex: 3 !important;
                /* 75% on mobile */
            }

            .btn-complete,
            .btn-share-ghost,
            .btn-random {
                font-size: 0.8rem !important;
                letter-spacing: 0.5px !important;
            }
        }

        /* --- STREAK & ACTION BAR --- */
        /* --- STREAK & ACTION BAR --- */
        /* --- STREAK & ACTION BAR --- */
        .game-bar {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 15px;
            /* Space from divider */
        }

        .streak-counter {
            background: rgba(255, 255, 255, 0.05);
            padding: 0;
            /* Remove padding, use flex centering */
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            gap: 6px;
            flex: 1;
            /* Default to 20% (1 vs 4) for desktop */
            height: 52px;
            /* Fixed height */
            min-width: 0;
            /* Allow shrinking if needed */
            cursor: default;
            transition: all 0.2s ease;
        }

        .btn-random {
            flex: 4;
            /* Default to 80% (4 vs 1) for desktop */
            height: 52px;
            /* Fixed height */
            margin-top: 0 !important;
            /* Override any top margin */
        }

        .action-bar {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            width: 100%;
        }

        .btn-primary,
        .btn-random,
        .btn-share-ghost,
        .btn-complete {
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .btn-share-ghost {
            flex: 1;
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 52px;
            letter-spacing: 1px;
        }

        .btn-share-ghost:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(56, 189, 248, 0.05);
        }

        .btn-complete {
            flex: 2;
            background: var(--success);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 52px;
            letter-spacing: 1px;
        }

        .btn-complete:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
        }

        .btn-complete:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            header {
                margin-top: 10px;
                /* Breathing room */
            }

            .header-content h1 {
                margin-top: 10px;
                /* Prevent overlap with badge if needed */
            }

            .streak-counter {
                font-size: 0.9rem;
                padding: 6px 12px;
            }

            .btn-complete {
                font-size: 0.8rem !important;
            }
        }

        /* --- CHECKBOX & COMPLETION STYLES --- */
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .interactive-card {
            cursor: pointer;
        }

        .exercise-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            cursor: pointer;
            border: 2px solid var(--accent);
            border-radius: 6px;
            background-color: transparent;
            display: grid;
            place-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .exercise-checkbox::before {
            content: "";
            width: 14px;
            height: 14px;
            transform: scale(0);
            transition: 0.2s transform ease-in-out;
            box-shadow: inset 14px 14px white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .exercise-checkbox:checked {
            background-color: var(--accent);
        }

        .exercise-checkbox:checked::before {
            transform: scale(1);
        }

        .exercise-card.checked {
            opacity: 0.6;
            border-left-color: var(--text-muted);
        }

        .exercise-card.checked h3 {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .btn-complete:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(1);
            pointer-events: none;
            box-shadow: none;
        }

        .btn-success-state {
            background: var(--success) !important;
            color: #0f172a !important;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.4) !important;
            cursor: default;
            transform: none !important;
        }

        @keyframes streak-pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        .pulse-animation {
            animation: streak-pulse 0.5s ease-in-out;
            color: var(--success);
            border-color: var(--success);
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <div class="header-content">
                <h1>Dryland<span>Pro</span></h1>
                <p class="subtitle">For swimmers. By a swimmer.</p>
            </div>
        </header>

        <div class="controls">
            <div class="search-section">
                <div>
                    <label>Equipment</label>
                    <select id="equipmentSelect">
                        <option value="all">Any Equipment</option>
                        <option value="None">None (Bodyweight)</option>
                        <option value="Band">Resistance Band</option>
                        <option value="Dumbbell">Dumbbell</option>
                        <option value="Cable Machine">Cable Machine</option>
                        <option value="Pull-up Bar">Pull-up Bar</option>
                        <option value="Medicine Ball">Medicine Ball</option>
                        <option value="Barbell">Barbell</option>
                        <option value="Plyo Box">Plyo Box</option>
                        <option value="Swiss Ball">Swiss Ball</option>
                    </select>
                </div>

                <div>
                    <label>Target Area</label>
                    <select id="targetSelect">
                        <option value="all">Any Muscle</option>
                        <option value="Core">Core</option>
                        <option value="Shoulders">Shoulders</option>
                        <option value="Legs">Legs & Glutes</option>
                        <option value="Back">Back & Lats</option>
                        <option value="Power">Power (Plyo)</option>
                        <option value="Full Body">Full Body</option>
                    </select>
                </div>

                <button class="btn-primary" onclick="findExercises()">SEARCH</button>
            </div>

            <div class="divider"><span>OR</span></div>

            <div class="game-bar">
                <button class="btn-random" onclick="generateRandomCircuit()"> Random Circuit</button>
                <div id="streak-counter" class="streak-counter">🔥 0</div>
            </div>
        </div>

        <div id="results-header"></div>

        <div id="results" class="results-grid">
            <div class="empty-state">Select filters above or generate a random circuit.</div>
        </div>

        <div id="action-bar" class="action-bar" style="display: none;">
            <button id="completeBtn" class="btn-complete" onclick="completeWorkout()">
                Complete Workout
            </button>
            <button id="shareBtn" class="btn-share-ghost" onclick="shareWorkout()">
                Share
            </button>
        </div>
    </div>

    <footer>
        <div id="db-count" style="font-size: 0.7rem; color: var(--text-muted); margin-bottom: 10px;"></div>
        <p>Missing a movement?</p>
        <p>
            <a href="mailto:chiriacalexandru05@icloud.com?subject=Dryland%20Pro%20Suggestion&body=Exercise%20Name:%0AEquipment:%0ATarget%20Area:"
                class="footer-link">
                Suggest an Exercise
            </a>
        </p>
        <p style="margin-top: 20px; opacity: 0.5; font-size: 0.7rem;">© 2025 Dryland Pro. Built by Alex.</p>
    </footer>

    <script>

            { name: "Jump Squats", equipment: "None", target: "Legs & Power", desc: "Squat down, explode up. Land softly. Keep core tight throughout. Full hip extension at top." },

        document.getElementById('db-count').innerText = `Database: ${exercises.length} Exercises`;

        const resultsContainer = document.getElementById('results');
        const resultsHeader = document.getElementById('results-header');
        const equipSelect = document.getElementById('equipmentSelect');
        const targetSelect = document.getElementById('targetSelect');
        // UI Elements
        const shareBtn = document.getElementById('shareBtn');
        const actionBar = document.getElementById('action-bar');
        const streakCounter = document.getElementById('streak-counter');

        // === STREAK LOGIC ===
        function initStreak() {
            const lastWorkout = localStorage.getItem('lastWorkoutDate');
            const currentStreak = parseInt(localStorage.getItem('streak') || '0');

            const today = new Date().toDateString();
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            const yesterdayStr = yesterday.toDateString();

            // Reset if missed yesterday (and didn't workout today yet)
            if (lastWorkout && lastWorkout !== today && lastWorkout !== yesterdayStr) {
                localStorage.setItem('streak', '0');
                streakCounter.innerText = '🔥 0';
            } else {
                streakCounter.innerText = `🔥 ${currentStreak}`;
            }
        }

        // Initialize on load
        initStreak();

        function completeWorkout() {
            const today = new Date().toDateString();
            const lastWorkout = localStorage.getItem('lastWorkoutDate');
            let currentStreak = parseInt(localStorage.getItem('streak') || '0');
            const btn = document.getElementById('completeBtn');
            let streakIncreased = false;

            // 1. Immediate Updates
            // Update Data
            if (lastWorkout !== today) {
                currentStreak++;
                localStorage.setItem('streak', currentStreak);
                localStorage.setItem('lastWorkoutDate', today);
                streakIncreased = true;
            }

            // Update Button State Immediately
            btn.innerText = "Session Complete";
            btn.classList.add('btn-success-state');

            // 2. Delay 700ms
            setTimeout(() => {
                // 3. Scroll to Top
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });

                // 4. Update Streak Visuals & Animate (Conditional)
                streakCounter.innerText = `🔥 ${currentStreak}`;

                if (streakIncreased) {
                    streakCounter.classList.add('pulse-animation');
                    // Remove animation class after 1s
                    setTimeout(() => {
                        streakCounter.classList.remove('pulse-animation');
                    }, 1000);
                }

                // 5. Clear UI & Show Success Message (Conditional)
                if (streakIncreased) {
                    resultsContainer.innerHTML = '<div class="empty-state" style="border-color: var(--success); color: var(--success);">Good job! See you tomorrow.</div>';
                } else {
                    resultsContainer.innerHTML = '<div class="empty-state">Select filters above or generate a random circuit.</div>';
                }

                resultsHeader.innerHTML = '';
                actionBar.style.display = 'none';

                // 6. Reset Button for next time (hidden)
                btn.innerText = "Complete Workout";
                btn.classList.remove('btn-success-state');

            }, 700);
        }

        function displayExercises(list, isRandom = false) {
            resultsContainer.innerHTML = '';

            // Handle Empty State
            if (list.length === 0) {
                resultsContainer.innerHTML = '<div class="empty-state">No exercises found for this specific combo.<br>Try setting one filter to "Any".</div>';
                resultsHeader.innerHTML = '';
                actionBar.style.display = 'none';
                return;
            }

            // Show Action Bar only for Random Circuit
            if (isRandom) {
                actionBar.style.display = 'flex';
                // Reset button state
                const btn = document.getElementById('completeBtn');
                btn.innerText = "Complete Workout";
                btn.classList.remove('btn-success-state');
                btn.disabled = true; // Lock initially
            } else {
                actionBar.style.display = 'none';
            }

            list.forEach(ex => {
                const card = document.createElement('div');
                // Add interactive class only if random
                card.className = isRandom ? 'exercise-card random-card interactive-card' : 'exercise-card';

                if (isRandom) {
                    card.onclick = (e) => handleCardClick(e, card);
                }

                // Add Flashlight Effect Listener
                card.onmousemove = (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    card.style.setProperty('--x', `${x}px`);
                    card.style.setProperty('--y', `${y}px`);
                };

                let headerHTML = `<h3>${ex.name}</h3>`;
                if (isRandom) {
                    headerHTML = `
                    <div class="card-header">
                        <input type="checkbox" class="exercise-checkbox" onchange="toggleCard(this)">
                        <h3>${ex.name}</h3>
                    </div>`;
                } else {
                    headerHTML = `<h3>${ex.name}</h3>`;
                }

                card.innerHTML = `
                    ${headerHTML}
                    
                    <div class="exercise-desc">
                        ${ex.desc}
                    </div>

                    <div class="meta-container">
                        <div class="meta-group">
                            <span class="meta-label">Equipment</span>
                            <span class="tag">${ex.equipment}</span>
                        </div>
                        <div class="meta-group">
                            <span class="meta-label">Target</span>
                            <span class="tag">${ex.target}</span>
                        </div>
                    </div>
                `;
                resultsContainer.appendChild(card);
            });
        }

        function findExercises() {
            const equip = equipSelect.value;
            const target = targetSelect.value;

            resultsHeader.innerHTML = '<div class="section-title">Specific Exercises</div>';

            const filtered = exercises.filter(ex => {
                const matchEquip = equip === 'all' || ex.equipment === equip;
                const matchTarget = target === 'all' || ex.target.includes(target);
                return matchEquip && matchTarget;
            });

            displayExercises(filtered);
        }

        function generateRandomCircuit() {
            equipSelect.value = 'all';
            targetSelect.value = 'all';

            const shuffled = [...exercises];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            const circuit = shuffled.slice(0, 4);

            resultsHeader.innerHTML = '<div class="section-title"> Random 4-Exercise Circuit</div>';
            displayExercises(circuit, true);
        }

        // --- SHARE FUNCTIONALITY ---
        function shareWorkout() {
            const cards = document.querySelectorAll('.exercise-card h3');
            if (cards.length === 0) return;

            let textToCopy = "🏊 Dryland Pro Workout 🏊\n\n";

            cards.forEach((card, index) => {
                textToCopy += `${index + 1}. ${card.innerText}\n`;
            });

            textToCopy += "\nGenerated at: dryland-pro.netlify.app";

            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = shareBtn.innerText;
                shareBtn.innerText = "Copied!";
                shareBtn.style.borderColor = "var(--success)";
                shareBtn.style.color = "var(--success)";

                setTimeout(() => {
                    shareBtn.innerText = originalText;
                    shareBtn.style.borderColor = "var(--text-muted)";
                    shareBtn.style.color = "var(--text-muted)";
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }
        function toggleCard(checkbox) {
            const card = checkbox.closest('.exercise-card');
            if (checkbox.checked) {
                card.classList.add('checked');
            } else {
                card.classList.remove('checked');
            }
            checkCompletion();
        }

        function handleCardClick(e, card) {
            const checkbox = card.querySelector('.exercise-checkbox');
            if (!checkbox) return;

            // If clicked directly on the checkbox, let the default behavior happen (it fires onchange)
            if (e.target === checkbox) return;

            // Otherwise toggle manually
            checkbox.checked = !checkbox.checked;
            toggleCard(checkbox);
        }

        function checkCompletion() {
            const checkboxes = document.querySelectorAll('.exercise-checkbox');
            const btn = document.getElementById('completeBtn');

            // If no checkboxes exist (e.g. search mode), exit
            if (checkboxes.length === 0) return;

            const allChecked = Array.from(checkboxes).every(cb => cb.checked);

            if (allChecked) {
                btn.disabled = false;
                btn.style.opacity = '1';
            } else {
                btn.disabled = true;
                btn.style.opacity = '0.5';
            }
        }
    </script>
